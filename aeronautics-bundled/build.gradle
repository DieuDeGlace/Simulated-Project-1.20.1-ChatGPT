plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
}

def modProps = new Properties()
file("${rootProject.projectDir}/aeronautics-bundled/gradle.properties").withInputStream { modProps.load(it) }

modProps.each { key, value ->
    project.ext.set(key.toString(), value)
}

version = project.mod_version
group = modProps.group
description = modProps.description

base {
    archivesName = "create-aeronautics-bundled-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

jar {
    from(rootProject.file('LICENSE.md'))

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                    : version,
            'group'                      : project.group,
            'minecraft_version'          : minecraft_version,
            'minecraft_version_range'    : minecraft_version_range,
            'mod_name'                   : mod_name,
            'mod_author'                 : mod_author,
            'mod_id'                     : mod_id,
            'license'                    : license,
            'description'                : project.description,
            'forge_version'              : forge_version,
            'forge_loader_version_range' : forge_loader_version_range,
            'sable_mod_version_range'    : sable_mod_version_range,
            'create_mod_version'         : create_mod_version,
            'flywheel_mod_version'       : flywheel_mod_version,
            'credits'                    : credits,
            'java_version'               : java_version
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

dependencies {
    jarJar(project(path: ":simulated:forge", configuration: "runtimeElements"))
    jarJar(project(path: ":aeronautics:forge", configuration: "runtimeElements"))
    jarJar(project(path: ":offroad:forge", configuration: "runtimeElements"))
}

test {
    useJUnitPlatform()
}
